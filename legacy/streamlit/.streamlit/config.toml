[theme]
base = "light"
primaryColor = "#1F4E79"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2430"
font = "sans serif"

[server]
headless = true
# per uploaded file, in MB; must be at least KG_MAX_UPLOAD_MB (the application limit for CSV uploads)
maxUploadSize = 50

[client]
toolbarMode = "minimal"
